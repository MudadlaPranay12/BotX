<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    #wrapper {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-app-region: drag;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
      padding-top: 10px;
      background: transparent !important;
      user-select: none;
      box-sizing: border-box;
      overflow: hidden;
    }

    .chat-card {
      order: 1;
      margin-bottom: 6px;
      padding: 9px 14px;
      min-height: 42px;
      height: auto;
      max-width: 280px;
      max-height: 300px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: rgba(10, 16, 26, 0.94);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-align: center;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 10;
      scrollbar-width: thin;
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
      -webkit-app-region: no-drag;
    }
    .chat-card::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid #00f0ff;
    }
    .chat-card.state-idle { border-color: #00f0ff; box-shadow: 0 0 14px rgba(0, 240, 255, 0.35); }
    .chat-card.state-idle::after { border-top-color: #00f0ff; }
    .chat-card.state-thinking { border-color: #00b4d8; box-shadow: 0 0 14px rgba(0, 180, 216, 0.35); }
    .chat-card.state-thinking::after { border-top-color: #00b4d8; }
    .chat-card.state-fix { border-color: #00ff88; box-shadow: 0 0 14px rgba(0, 255, 136, 0.35); }
    .chat-card.state-fix::after { border-top-color: #00ff88; }
    .chat-card.state-confused { border-color: #ffb703; box-shadow: 0 0 14px rgba(255, 183, 3, 0.35); }
    .chat-card.state-confused::after { border-top-color: #ffb703; }
    .chat-card.state-error { border-color: #ff4d4d; box-shadow: 0 0 14px rgba(255, 77, 77, 0.4); }
    .chat-card.state-error::after { border-top-color: #ff4d4d; }
    .chat-card.typing::after {
      content: '▍';
      border: none;
      position: static;
      transform: none;
      display: inline-block;
      margin-left: 1px;
      animation: caretBlink 0.9s steps(1) infinite;
    }
    @keyframes caretBlink { 0%, 50% { opacity: 1; } 50.1%, 100% { opacity: 0; } }

    .eilik-robot {
      order: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      flex-shrink: 0;
    }
    .robot-scale {
      transform-origin: top center;
      will-change: transform;
      transition: transform 0.3s ease;
    }
    #robot.expr-idle { animation: floatIdle 4.2s ease-in-out infinite; }
    #robot.expr-thinking { animation: thinkRock 2.4s ease-in-out infinite; }
    #robot.expr-alert { animation: alertJitter 0.7s ease-in-out 3; }
    #robot.expr-happy { animation: happyBounce 0.9s ease-in-out 2; }
    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes thinkRock {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    @keyframes alertJitter {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-3px); }
      50% { transform: translateY(-6px); }
      75% { transform: translateY(-3px); }
    }
    @keyframes happyBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-9px) scale(1.03); }
    }

    .robot-svg {
      width: 125px; height: 150px;
      overflow: visible;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }
    #robot.expr-idle .robot-svg { animation: breathe 5.5s ease-in-out infinite; }
    #robot.expr-happy .robot-svg { animation: happySpin 0.8s ease-in-out 2; }
    #robot.expr-confused .robot-svg { animation: confusedTilt 1.4s ease-in-out; }
    #robot.expr-helpful .robot-svg { animation: breathe 3.5s ease-in-out infinite; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
    @keyframes happySpin {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.04) rotate(-3deg); }
    }
    @keyframes confusedTilt {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg); }
      50% { transform: translateY(-3px); }
      75% { transform: rotate(3deg); }
    }

    .eye {
      transition: fill 0.35s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
      fill: var(--eye-color, #00f0ff);
    }
    .eye-spec { transition: opacity 0.25s ease; }
    .left-eye { transform-origin: 81px 63px; }
    .right-eye { transform-origin: 119px 63px; }

    .expr-happy .left-eye { clip-path: url(#happyLeft); }
    .expr-happy .right-eye { clip-path: url(#happyRight); }
    .expr-happy .eye-spec { opacity: 0; }
    .expr-happy .eye { fill: #00ff88; }

    .expr-confused .left-eye { transform: rotate(18deg); fill: #ffb703; }
    .expr-confused .right-eye { fill: #ffb703; }

    .expr-thinking .eye { fill: #00b4d8; transform: translateY(-5px) scale(0.72); }
    .expr-thinking .eye-spec { opacity: 0; }

    .expr-helpful .eye { fill: #00ff88; }

    .expr-alert .eye { fill: #ff4d4d; transform: scale(1.4); }
    .expr-alert .eye-spec { opacity: 0; }

    .blinking .eye { transform: scaleY(0.08) !important; }
    .blinking .eye-spec { opacity: 0; }

    #mouthStroke {
      transition: opacity 0.3s ease, stroke 0.35s ease;
    }
    #mouthOpen {
      transform-origin: 100px 86px;
      transform: scale(0.6);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .expr-alert #mouthStroke { opacity: 0; }
    .expr-alert #mouthOpen { opacity: 1; transform: scale(1); }

    .arm-g {
      transition: transform 0.3s ease;
      transform-origin: 42px 142px;
    }
    .arm-g.right-arm-g { transform-origin: 158px 142px; }
    .eilik-robot:hover .arm-g { transform: rotate(14deg); }
    .eilik-robot:hover .right-arm-g { transform: rotate(-14deg); }

    .nod { animation: eilikNod 0.5s ease-in-out !important; }
    .shake { animation: eilikShake 0.5s ease-in-out !important; }
    @keyframes eilikNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes eilikShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px) rotate(-3deg); }
      75% { transform: translateX(6px) rotate(3deg); }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="app-container">
      <div class="chat-card" id="chatCard">CONNECTED</div>
      <div class="eilik-robot" id="robot">
        <div class="robot-scale" id="robotScale">
        <svg class="robot-svg" viewBox="0 0 200 240" width="125" height="150">
          <defs>
            <radialGradient id="realBodyGrad" cx="30%" cy="25%" r="75%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="45%" stop-color="#f1f5f9" />
              <stop offset="80%" stop-color="#cbd5e1" />
              <stop offset="100%" stop-color="#94a3b8" />
            </radialGradient>
            <radialGradient id="realGlassGrad" cx="50%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="40%" stop-color="#0f172a" />
              <stop offset="100%" stop-color="#020617" />
            </radialGradient>
            <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="1.5" result="blur1" />
              <feGaussianBlur stdDeviation="5" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
            </filter>

            <clipPath id="happyLeft"><rect x="69" y="63" width="24" height="12" rx="3"/></clipPath>
            <clipPath id="happyRight"><rect x="107" y="63" width="24" height="12" rx="3"/></clipPath>
            <clipPath id="sadLeft"><rect x="69" y="52" width="24" height="12" rx="3"/></clipPath>
            <clipPath id="sadRight"><rect x="107" y="52" width="24" height="12" rx="3"/></clipPath>
          </defs>

          <ellipse cx="100" cy="225" rx="45" ry="8" fill="#000000" opacity="0.25" filter="url(#dropShadow)" />

          <g class="arm-g" filter="url(#dropShadow)">
            <ellipse cx="42" cy="142" rx="11" ry="26" fill="url(#realBodyGrad)" />
            <ellipse cx="38" cy="130" rx="4" ry="12" fill="#ffffff" opacity="0.6" />
          </g>

          <g class="arm-g right-arm-g" filter="url(#dropShadow)">
            <ellipse cx="158" cy="142" rx="11" ry="26" fill="url(#realBodyGrad)" />
            <ellipse cx="154" cy="130" rx="4" ry="12" fill="#ffffff" opacity="0.6" />
          </g>

          <g filter="url(#dropShadow)">
            <path d="M 62,110 C 62,100 138,100 138,110 C 146,150 136,192 100,192 C 64,192 54,150 62,110 Z" fill="url(#realBodyGrad)" />
            <path d="M 72,118 C 80,112 120,112 128,118 C 120,130 80,130 72,118 Z" fill="#ffffff" opacity="0.45" />
            <circle cx="100" cy="148" r="4.5" fill="#38bdf8" opacity="0.9" filter="url(#ultraGlow)" />
          </g>

          <ellipse cx="100" cy="104" rx="34" ry="8" fill="#020617" opacity="0.4" />

          <g filter="url(#dropShadow)">
            <ellipse cx="100" cy="62" rx="58" ry="43" fill="url(#realBodyGrad)" />
            <path d="M 55,42 Q 100,24 145,42 Q 100,32 55,42 Z" fill="#ffffff" opacity="0.75" />
            <rect x="38" y="52" width="6" height="20" rx="3" fill="#64748b" />
            <rect x="156" y="52" width="6" height="20" rx="3" fill="#64748b" />
            <ellipse cx="100" cy="63" rx="45" ry="29" fill="#0f172a" />
            <ellipse cx="100" cy="63" rx="43" ry="27" fill="url(#realGlassGrad)" />
            <path d="M 62,48 Q 100,38 138,48 C 125,43 75,43 62,48 Z" fill="#ffffff" opacity="0.35" />

            <g id="eyes" filter="url(#ultraGlow)">
              <ellipse class="eye left-eye" cx="81" cy="63" rx="9.5" ry="11" />
              <circle class="eye-spec" cx="79" cy="59" r="2.5" fill="#ffffff" opacity="0.8" />
              <ellipse class="eye right-eye" cx="119" cy="63" rx="9.5" ry="11" />
              <circle class="eye-spec" cx="117" cy="59" r="2.5" fill="#ffffff" opacity="0.8" />
            </g>

            <g id="mouthGroup">
              <path id="mouthStroke" fill="none" stroke="var(--face-color, #00f0ff)" stroke-width="3" stroke-linecap="round" d="M 93,85 C 97,89 103,89 107,85" />
              <path id="mouthOpen" fill="#0f172a" stroke="var(--face-color, #00f0ff)" stroke-width="2.5" opacity="0" d="M 95,86 A 5,5 0 1 0 105,86 A 5,5 0 1 0 95,86 Z" />
            </g>
          </g>
        </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const robot = document.getElementById('robot');
    const root = document.documentElement;
    const chatCard = document.getElementById('chatCard');
    const robotScale = document.getElementById('robotScale');
    const mouthStroke = document.getElementById('mouthStroke');
    const mouthOpen = document.getElementById('mouthOpen');

    const VALID_STATES = new Set(['IDLE', 'THINKING', 'HAPPY', 'CONFUSED', 'HELPFUL', 'ALERT']);
    const ACCENTS = {
      IDLE: '#00f0ff',
      THINKING: '#00b4d8',
      HAPPY: '#00ff88',
      CONFUSED: '#ffb703',
      HELPFUL: '#00ff88',
      ALERT: '#ff4d4d'
    };
    const ACCENT_CLASS = {
      IDLE: 'state-idle',
      THINKING: 'state-thinking',
      HAPPY: 'state-fix',
      CONFUSED: 'state-confused',
      HELPFUL: 'state-fix',
      ALERT: 'state-error'
    };
    const MOUTHS = {
      IDLE:     { p0: { x: 93, y: 85 }, c1: { x: 97, y: 89 }, c2: { x: 103, y: 89 }, p3: { x: 107, y: 85 } },
      THINKING: { p0: { x: 91, y: 86 }, c1: { x: 96, y: 84 }, c2: { x: 102, y: 84 }, p3: { x: 109, y: 86 } },
      HAPPY:    { p0: { x: 88, y: 85 }, c1: { x: 96, y: 96 }, c2: { x: 104, y: 96 }, p3: { x: 112, y: 85 } },
      CONFUSED: { p0: { x: 88, y: 87 }, c1: { x: 94, y: 80 }, c2: { x: 100, y: 89 }, p3: { x: 112, y: 86 } },
      HELPFUL:  { p0: { x: 90, y: 85 }, c1: { x: 96, y: 93 }, c2: { x: 104, y: 93 }, p3: { x: 110, y: 85 } },
      ALERT:    { p0: { x: 95, y: 84 }, c1: { x: 97, y: 90 }, c2: { x: 103, y: 90 }, p3: { x: 105, y: 84 } }
    };
    const TRANSIENT_HOLD_MS = { HAPPY: 6000, CONFUSED: 6000, HELPFUL: 6000, THINKING: 10000 };
    const BUBBLE_HOLD_MS = 4000;
    const ROBOT_BASE_H = 150;
    const ROBOT_MIN_H = 52;
    const BUBBLE_MIN_H = 42;
    const BUBBLE_MAX_H = 300;
    const APP_PAD_TOP = 10;
    const BUBBLE_GAP = 6;

    let currentMouth = null;
    let mouthTween = null;
    let blinkTimer = null;
    let blinkOffTimer = null;
    let typeTimer = null;
    let dismissTimer = null;
    let lastStatus = 'CONNECTED';
    let pendingLayout = false;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function fitToWindow() {
      var avail = window.innerHeight - APP_PAD_TOP;
      var contentH = chatCard.scrollHeight;
      var availBubble = avail - ROBOT_MIN_H - BUBBLE_GAP;
      var targetBubble = clamp(contentH, BUBBLE_MIN_H, Math.min(availBubble, BUBBLE_MAX_H));
      var maxH = Math.floor(targetBubble);
      if (chatCard._fitMaxH !== maxH) {
        chatCard._fitMaxH = maxH;
        chatCard.style.maxHeight = maxH + 'px';
      }
      var bubbleActual = chatCard.offsetHeight;
      var robotSpace = avail - bubbleActual - BUBBLE_GAP;
      var scale = clamp(robotSpace / ROBOT_BASE_H, ROBOT_MIN_H / ROBOT_BASE_H, 1);
      if (robotScale._fitScale !== scale) {
        robotScale._fitScale = scale;
        robotScale.style.transform = 'scale(' + scale.toFixed(3) + ')';
      }
    }
    function requestFit() {
      if (pendingLayout) { return; }
      pendingLayout = true;
      requestAnimationFrame(function () {
        pendingLayout = false;
        fitToWindow();
      });
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function mouthToPath(m) {
      return 'M ' + m.p0.x + ',' + m.p0.y +
        ' C ' + m.c1.x + ',' + m.c1.y +
        ' ' + m.c2.x + ',' + m.c2.y +
        ' ' + m.p3.x + ',' + m.p3.y;
    }
    function interpMouth(from, to, t) {
      return {
        p0: { x: lerp(from.p0.x, to.p0.x, t), y: lerp(from.p0.y, to.p0.y, t) },
        c1: { x: lerp(from.c1.x, to.c1.x, t), y: lerp(from.c1.y, to.c1.y, t) },
        c2: { x: lerp(from.c2.x, to.c2.x, t), y: lerp(from.c2.y, to.c2.y, t) },
        p3: { x: lerp(from.p3.x, to.p3.x, t), y: lerp(from.p3.y, to.p3.y, t) }
      };
    }
    function applyMouth(m) { mouthStroke.setAttribute('d', mouthToPath(m)); }

    var expression = (function () {
      var state = 'IDLE';
      var queue = [];
      var holdTimer = null;
      var playing = false;

      function normalize(value) {
        var up = String(value || '').toUpperCase();
        return VALID_STATES.has(up) ? up : 'IDLE';
      }
      function morphMouth(target) {
        if (!currentMouth) { currentMouth = target; applyMouth(target); return; }
        var from = currentMouth;
        var start = performance.now();
        var dur = 300;
        if (mouthTween) { cancelAnimationFrame(mouthTween); mouthTween = null; }
        function frame(now) {
          var t = Math.min(1, (now - start) / dur);
          var e = easeInOutCubic(t);
          currentMouth = interpMouth(from, target, e);
          applyMouth(currentMouth);
          if (t < 1) { mouthTween = requestAnimationFrame(frame); }
          else { currentMouth = target; applyMouth(target); mouthTween = null; }
        }
        mouthTween = requestAnimationFrame(frame);
      }
      function setAccent(s) {
        chatCard.classList.remove('state-idle', 'state-thinking', 'state-fix', 'state-confused', 'state-error');
        var accent = ACCENTS[s];
        root.style.setProperty('--eye-color', accent);
        root.style.setProperty('--face-color', accent);
        chatCard.classList.add(ACCENT_CLASS[s] || 'state-idle');
      }
      function cancelBlink() {
        if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = null; }
        if (blinkOffTimer) { clearTimeout(blinkOffTimer); blinkOffTimer = null; }
        robot.classList.remove('blinking');
      }
      function scheduleBlink() {
        cancelBlink();
        blinkTimer = setTimeout(function () {
          blinkTimer = null;
          if (expression.state !== 'IDLE') { scheduleBlink(); return; }
          robot.classList.add('blinking');
          blinkOffTimer = setTimeout(function () {
            blinkOffTimer = null;
            robot.classList.remove('blinking');
            scheduleBlink();
          }, 130);
        }, 2200 + Math.random() * 3200);
      }
      function show(s) {
        state = normalize(s);
        robot.classList.remove('expr-idle', 'expr-thinking', 'expr-happy', 'expr-confused', 'expr-helpful', 'expr-alert');
        robot.classList.add('expr-' + state.toLowerCase());
        if (state === 'IDLE') { scheduleBlink(); } else { cancelBlink(); }
        setAccent(state);
        morphMouth(MOUTHS[state]);
        return state;
      }
      function arrive(s) {
        var hold = TRANSIENT_HOLD_MS[s] || 0;
        this.playing = true;
        this.state = show(s);
        holdTimer = setTimeout(function () {
          holdTimer = null;
          expression.playing = false;
          if (expression.queue.length) { expression._next(); }
          else if (expression.state !== 'IDLE') { expression.state = expression.show('IDLE'); }
        }, hold || 400);
      }
      function _next() {
        if (this.playing) { return; }
        if (this.queue.length) { this.arrive(this.queue.shift()); }
        else if (this.state !== 'IDLE') { this.arrive('IDLE'); }
      }
      function go(s) {
        s = normalize(s);
        if (this.state === s && this.playing) { return; }
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        this.queue.length = 0;
        this.playing = false;
        this.arrive(s);
      }
      return {
        state: state,
        queue: queue,
        go: go,
        arrive: arrive,
        _next: _next,
        show: show,
        setAccent: setAccent
      };
    })();

    function resolveExpression(expr, action) {
      var e = String(expr || '').toLowerCase();
      var a = String(action || '').toUpperCase();
      if (a === 'ALERT' || a === 'ALERT_RED' || a === 'ERROR' || a === 'WARNING' || a === 'FAIL' || e === 'alert' || e === 'sad' || e === 'worried' || e === 'shocked' || e === 'error' || e === 'alarm') return 'ALERT';
      if (a === 'JUMP' || a === 'NOD' || e === 'happy' || e === 'joy' || e === 'excited') return 'HAPPY';
      if (a === 'THINKING' || e === 'thinking' || e === 'processing' || e === 'loading') return 'THINKING';
      if (a === 'CONFUSED' || e === 'confused' || e === 'puzzled' || e === 'unsure' || e === 'huh') return 'CONFUSED';
      if (a === 'HELPFUL' || e === 'helpful' || e === 'working' || e === 'friendly') return 'HELPFUL';
      if (VALID_STATES.has(a)) { return a; }
      var up = String(expr || '').toUpperCase();
      if (VALID_STATES.has(up)) { return up; }
      return 'IDLE';
    }
    function maybeExpressionFromMap(payload) {
      if (payload.state) { return resolveExpression(payload.state, payload.action); }
      return resolveExpression(payload.expression, payload.action);
    }

    function setStatus(text) {
      lastStatus = text;
      cancelText();
      chatCard.textContent = text;
      requestFit();
    }

    function formatSpeech(text) {
      return String(text || '')
        .replace(/\r\n/g, '\n')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function showSpeech(text) {
      cancelText();
      chatCard.classList.add('typing');
      chatCard.textContent = '';
      requestFit();
      var clean = formatSpeech(text);
      chatCard.setAttribute('aria-label', clean);
      var speed = clean.length > 180 ? 6 : clean.length > 90 ? 10 : 15;
      var i = 0;
      typeTimer = setInterval(function () {
        if (i < clean.length) {
          chatCard.textContent = clean.slice(0, ++i);
          chatCard.scrollTop = chatCard.scrollHeight;
          requestFit();
        } else {
          clearInterval(typeTimer);
          typeTimer = null;
          chatCard.classList.remove('typing');
          chatCard.textContent = clean;
          chatCard.scrollTop = chatCard.scrollHeight;
          requestFit();
          dismissTimer = setTimeout(function () {
            dismissTimer = null;
            chatCard.textContent = lastStatus;
            requestFit();
          }, BUBBLE_HOLD_MS);
        }
      }, speed);
    }
    function cancelText() {
      if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
      if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
      chatCard.classList.remove('typing');
      requestFit();
    }

    function handleBrainMessage(msg) {
      var t = (msg.type || '').toUpperCase();
      var p, speech;

      if (t === 'ROBOT_STATE') {
        p = msg;
        expression.go(resolveExpression(p.expression, p.action));
        speech = p.speechBubble;
        if (speech) { showSpeech(speech); }
        else { setStatus('CONNECTED'); }
      } else if (t === 'ROBOT_STATE_UPDATE') {
        var payload = msg.payload || {};
        speech = payload.speechBubble || msg.speech;
        expression.go(maybeExpressionFromMap(payload));
        if (speech) { showSpeech(speech); }
        else { setStatus('CONNECTED'); }
      } else if (t === 'ACTION') {
        p = msg;
        expression.go(resolveExpression(p.expression, p.animation));
        speech = p.speech;
        if (speech) { showSpeech(speech); }
        else { setStatus('CONNECTED'); }
      } else if (t === 'CONNECTION_STATUS') {
        setStatus(msg.status === 'CONNECTED' ? 'CONNECTED' : 'DISCONNECTED');
    expression.go('IDLE');
    requestFit();
    window.addEventListener('resize', requestFit);
      } else if (t === 'WINDOW_VISIBILITY') {
        document.body.style.opacity = msg.visible ? '1' : '0.3';
      }
    }

    function maybeExpressionFromMap(payload) {
      if (payload.action || payload.expression) {
        return resolveExpression(payload.expression || payload.action, payload.action);
      }
      if (payload.state) { return resolveExpression(payload.state, payload.action); }
      return resolveExpression('', '');
    }

    expression.go('IDLE');

    var reconnectAttempt = 0;
    var MAX_RECONNECT_DELAY = 30000;
    var BASE_RECONNECT_DELAY = 3000;

    function getReconnectDelay() {
      var delay = Math.min(BASE_RECONNECT_DELAY * Math.pow(2, reconnectAttempt), MAX_RECONNECT_DELAY);
      return delay + Math.random() * 3000;
    }

    function connectWs() {
      var ws;
      try {
        ws = new WebSocket('ws://localhost:8055');
        ws.onopen = function () { reconnectAttempt = 0; setStatus('CONNECTED'); expression.go('IDLE'); };
        ws.onmessage = function (e) {
          var msg;
          try { msg = JSON.parse(e.data); } catch (_) { return; }
          handleBrainMessage(msg);
        };
        ws.onclose = function () { var d = getReconnectDelay(); reconnectAttempt += 1; setStatus('RECONNECTING'); setTimeout(connectWs, d); };
        ws.onerror = function () {};
      } catch (_) {
        var d = getReconnectDelay();
        reconnectAttempt += 1;
        setStatus('RECONNECTING');
        setTimeout(connectWs, d);
      }
    }

    ipcRenderer.on('brain-event', function (_event, data) { handleBrainMessage(data); });
    connectWs();
  </script>
</body>
